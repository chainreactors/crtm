- name: gogo
  repo: chainreactors/gogo
  asset_pattern: "{name}_{os}_{arch}"
  description: "Host, port, service and banner discovery"
  tags: [port, service, scanner, discovery, network]
  category: scanner
  docs_url: https://chainreactors.github.io/wiki/gogo/
  hint: "Built-in as pseudo-command. Use `gogo` via bash directly — no install needed unless you want a standalone binary."

