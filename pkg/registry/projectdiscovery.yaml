- name: nuclei
  repo: projectdiscovery/nuclei
  asset_pattern: "{name}_{version}_{os}_{arch}.zip"
  description: "Fast vulnerability scanner with 9000+ community templates"
  tags: [poc, template, cve, vulnerability, scanner]
  category: scanner
  docs_url: https://docs.projectdiscovery.io/tools/nuclei/overview
  hint: "Run `nuclei -update-templates` after first install to fetch template library."

- name: httpx
