- name: rg
  repo: BurntSushi/ripgrep
  asset_pattern: "ripgrep-{version}"
  tag_pattern: "{version}"
  executable: rg
  category: audit
  platforms:
    windows/amd64:
      asset: "ripgrep-{version}-x86_64-pc-windows-msvc.zip"
    windows/arm64:
      asset: "ripgrep-{version}-aarch64-pc-windows-msvc.zip"
    linux/amd64:
      asset: "ripgrep-{version}-x86_64-unknown-linux-musl.tar.gz"
    linux/arm64:
      asset: "ripgrep-{version}-aarch64-unknown-linux-musl.tar.gz"
    darwin/amd64:
      asset: "ripgrep-{version}-x86_64-apple-darwin.tar.gz"
    darwin/arm64:
      asset: "ripgrep-{version}-aarch64-apple-darwin.tar.gz"

- name: ast-grep
  repo: ast-grep/ast-grep
  asset_pattern: "app"
  tag_pattern: "{version}"
  executable: ast-grep
  category: audit
  platforms:
    windows/amd64:
      asset: "app-x86_64-pc-windows-msvc.zip"
    windows/arm64:
      asset: "app-aarch64-pc-windows-msvc.zip"
    linux/amd64:
      asset: "app-x86_64-unknown-linux-gnu.zip"
    linux/arm64:
      asset: "app-aarch64-unknown-linux-gnu.zip"
    darwin/amd64:
      asset: "app-x86_64-apple-darwin.zip"
    darwin/arm64:
      asset: "app-aarch64-apple-darwin.zip"

- name: osv-scanner
  repo: google/osv-scanner
  tags: [scanner, sca]
  asset_pattern: "osv-scanner"
  tag_pattern: "v{version}"
  executable: osv-scanner
  category: audit
  platforms:
    windows/amd64:
      asset: "osv-scanner_windows_amd64.exe"
    windows/arm64:
      asset: "osv-scanner_windows_arm64.exe"
    linux/amd64:
      asset: "osv-scanner_linux_amd64"
    linux/arm64:
      asset: "osv-scanner_linux_arm64"
    darwin/amd64:
      asset: "osv-scanner_darwin_amd64"
    darwin/arm64:
      asset: "osv-scanner_darwin_arm64"
